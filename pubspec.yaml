name: expense_tracker
description: A calm, local-first expense tracker for web, Android, and Linux.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path: ^1.9.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^2.9.4
  sqflite_common_ffi_web: ^1.0.2
  path_provider: ^2.1.2
  shared_preferences: ^2.3.3
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
